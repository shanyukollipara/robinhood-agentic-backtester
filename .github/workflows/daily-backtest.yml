# Re-runs every example strategy against fresh market data once a day and
# commits the updated results. The numbers change because the market moved.
name: Daily backtest

on:
  schedule:
    # 22:15 UTC = 5:15pm US Eastern, comfortably after the closing bell so the
    # day's bar exists. GitHub's scheduler is best effort and can run late.
    - cron: "15 22 * * *"
  workflow_dispatch:

# Needed so the job can push the results it generates.
permissions:
  contents: write

concurrency:
  group: daily-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data]"

      - name: Run every strategy against fresh data
        id: backtest
        run: |
          # Market data providers rate-limit; one retry is usually enough.
          python scripts/daily_report.py || {
            echo "First attempt failed, retrying in 90s..."
            sleep 90
            python scripts/daily_report.py
          }

      - name: Keep the full tearsheets and JSON as build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tearsheets-${{ github.run_number }}
          path: |
            reports/*.html
            results/*.json
          retention-days: 90
          if-no-files-found: warn

      - name: Commit the updated results
        run: |
          git config user.name "shanyukollipara"
          git config user.email "shanyukollipara@gmail.com"
          # Only the small files are versioned - see .gitignore.
          git add results/RESULTS.md results/history.csv
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit."
            exit 0
          fi
          git commit -m "Daily backtest: results as of $(date -u +%Y-%m-%d)"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "## Daily backtest - $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            sed -n '5,12p' results/RESULTS.md 2>/dev/null || echo "No results were produced."
          } >> "$GITHUB_STEP_SUMMARY"
